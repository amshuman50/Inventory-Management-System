components:
  schemas:
    RegistrationRequest:
      type: object
      required:
        - name
        - phone
        - address
        - email
        - password
        - roles
      properties:
        name:
          type: string
          example: Admin

        phone:
          type: string
          example: "9866545877"

        address:
          type: object
          required:
            - country
            - province
          properties:
            country:
              type: string
              example: Nepal

            province:
              type: string
              example: Bagmati

        email:
          type: string
          format: email
          example: admin21@gmail.com

        password:
          type: string
          format: password
          example: Password@123

        roles:
          type: array
          items:
            type: string
            enum:
              - ADMIN
              - PRODUCT_MANAGER
              - SALES_MANAGER
          example:
            - ADMIN
