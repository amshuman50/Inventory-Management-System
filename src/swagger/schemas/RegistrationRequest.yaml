components:
  schemas:
    RegistrationRequest:
      type: object

      required:
        - name
        - phone
        - address
        - email
        - password

      properties:
        _id:
          type: string
          example: 688a65d92dc1d7c53bc12345

        name:
          type: string
          minLength: 3
          maxLength: 50
          example: John Doe

        phone:
          type: string
          minLength: 6
          maxLength: 13
          example: "9801234567"

        address:
          type: object

          properties:
            country:
              type: string
              example: Nepal

            province:
              type: string
              example: Bagmati

        email:
          type: string
          format: email
          example: john@example.com

        password:
          type: string
          minLength: 6
          example: password123

        isActive:
          type: boolean
          default: true
          example: true

        profileImageUrl:
          type: string
          example: https://example.com/profile.jpg

        roles:
          type: array

          items:
            type: string
            enum:
              - SUPER_ADMIN
              - ADMIN
              - PURCHASE_MANAGER
              - SALES_MANAGER
              - CUSTOMER

          example:
            - CUSTOMER

        contactPerson:
          type: string
          example: Ram Sharma

        customerType:
          type: string
          example: Wholesale

        status:
          type: string

          enum:
            - PENDING
            - APPROVED
            - REJECTED
            - UNDERREVIEW

          example: PENDING

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time
